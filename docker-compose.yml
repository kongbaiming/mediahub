# ============================================================
# MediaHub Docker Compose - DS920+ 优化版
# ============================================================

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: mediahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 挂载点必须是父目录，PGDATA 子目录由 postgres 自己管理
      # （postgres entrypoint 会检测 PGDATA/pg_version，存在则不 init）
      - /volume1/docker/mediahub/postgres:/var/lib/postgresql/data
    # 注意：POSTGRES_PORT 是宿主机端口（对外暴露），容器内固定用 5432
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediahub-net

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: mediahub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /volume1/docker/mediahub/redis:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediahub-net

  # ---------- MediaHub API (Go + Gin) ----------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: mediahub-api
    restart: unless-stopped
    # 注意：API 进程以容器默认 root 身份跑（user 不设）。
    #   - 优势：能直接读 /volume1/* bind mount 的所有文件（walker 不报权限错）
    #   - 副作用：fsnotify.Add() 在容器内 root 跨 mount namespace 会被内核拒，
    #     所以实时监听失效（WARN "添加监听失败"）。但 scanner.StartWatcher
    #     里同时跑 30 分钟一次的 filepath.Walk 轮询，不依赖 fsnotify，
    #     所以功能不受影响——只是新建文件后要等最多 30 分钟才入库。
    #   - 想要实时监听：把这一行打开并设成 NAS 上能访问挂载目录的 UID/GID
    #     （比如 qbittorrent 用 1026:100，但你 SSH 是 root 的话用 root 更稳）
    # user: "0:0"
    environment:
      API_PORT: ${API_PORT}
      API_MODE: ${API_MODE}
      API_JWT_SECRET: ${API_JWT_SECRET}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE}
      TMDB_BASE_URL: ${TMDB_BASE_URL}
      MEDIA_ROOT: ${MEDIA_ROOT}
      TRANSCODE_ENABLED: ${TRANSCODE_ENABLED}
      TRANSCODE_HW_ACCEL: ${TRANSCODE_HW_ACCEL}
      SCRAPER_WORKER_COUNT: ${SCRAPER_WORKER_COUNT}
      DOWNLOAD_ROOT: ${DOWNLOAD_ROOT}
      DOWNLOADER_ENABLED: ${DOWNLOADER_ENABLED:-true}
      DOWNLOADER_WATCH_INTERVAL: ${DOWNLOADER_WATCH_INTERVAL:-5}
      QBIT_HOST: ${QBIT_HOST:-qbittorrent}
      QBIT_PORT: ${QBIT_PORT:-8080}
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASSWORD: ${QBIT_PASSWORD}
      QBIT_TLS: ${QBIT_TLS:-false}
    volumes:
      - ${NAS_MEDIA_HOST}:${MEDIA_ROOT}
      - ${NAS_DOWNLOADS_HOST}:${DOWNLOAD_ROOT}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 健康检查（admin / web-player 依赖）
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # DS920+ 硬件转码需要 Intel 设备直通
    devices:
      - /dev/dri:/dev/dri
    networks:
      - mediahub-net

  # ---------- CMS Admin (Vue3 SPA) ----------
  admin:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    container_name: mediahub-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mediahub-net

  # ---------- Web Player (Vue3 SPA) ----------
  web-player:
    build:
      context: ./services/web-player
      dockerfile: Dockerfile
    container_name: mediahub-web-player
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mediahub-net

  # ---------- qBittorrent (下载客户端) ----------
  qbittorrent:
    image: linuxserver/qbittorrent:5.0.2
    container_name: mediahub-qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1026
      PGID: 100
      TZ: Asia/Shanghai
      WEBUI_PORT: 8080
      # 启动前由 scripts/qbit-init-password.sh 写入 qBittorrent.conf
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASSWORD: ${QBIT_PASSWORD}
    volumes:
      - /volume1/docker/mediahub/qbittorrent/config:/config
      - ${NAS_DOWNLOADS_HOST}:/downloads
      - ./scripts/qbit-init-password.sh:/config/custom-cont-init.d/99-set-password:ro
    ports:
      - "${QBIT_PORT}:8080"
    networks:
      - mediahub-net

networks:
  mediahub-net:
    driver: bridge

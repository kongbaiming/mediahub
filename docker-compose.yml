# ============================================================
# MediaHub Docker Compose - DS920+ 优化版
# ============================================================

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: mediahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /volume1/docker/mediahub/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediahub-net

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: mediahub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /volume1/docker/mediahub/redis:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediahub-net

  # ---------- MediaHub API (Go + Gin) ----------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: mediahub-api
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT}
      API_MODE: ${API_MODE}
      API_JWT_SECRET: ${API_JWT_SECRET}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE}
      TMDB_BASE_URL: ${TMDB_BASE_URL}
      MEDIA_ROOT: ${MEDIA_ROOT}
      TRANSCODE_ENABLED: ${TRANSCODE_ENABLED}
      TRANSCODE_HW_ACCEL: ${TRANSCODE_HW_ACCEL}
      SCRAPER_WORKER_COUNT: ${SCRAPER_WORKER_COUNT}
    volumes:
      - ${NAS_MEDIA_HOST}:${MEDIA_ROOT}
      - ${NAS_DOWNLOADS_HOST}:${DOWNLOAD_ROOT}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # DS920+ 硬件转码需要 Intel 设备直通
    devices:
      - /dev/dri:/dev/dri
    networks:
      - mediahub-net

  # ---------- CMS Admin (Vue3 SPA) ----------
  admin:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    container_name: mediahub-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT}:80"
    depends_on:
      - api
    networks:
      - mediahub-net

  # ---------- Web Player (Vue3 SPA) ----------
  web-player:
    build:
      context: ./services/web-player
      dockerfile: Dockerfile
    container_name: mediahub-web-player
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - api
    networks:
      - mediahub-net

  # ---------- qBittorrent (下载客户端) ----------
  qbittorrent:
    image: linuxserver/qbittorrent:5.0.2
    container_name: mediahub-qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1026
      PGID: 100
      TZ: Asia/Shanghai
      WEBUI_PORT: 8080
    volumes:
      - /volume1/docker/mediahub/qbittorrent/config:/config
      - ${NAS_DOWNLOADS_HOST}:/downloads
    ports:
      - "${QBIT_PORT}:8080"
    networks:
      - mediahub-net

networks:
  mediahub-net:
    driver: bridge

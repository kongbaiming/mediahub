name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- 后端 Go ----------
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediahub
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediahub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api/go.sum

      - name: Download deps
        working-directory: services/api
        run: go mod download

      - name: Lint
        working-directory: services/api
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0
          golangci-lint run ./...

      - name: Test
        working-directory: services/api
        env:
          DATABASE_URL: postgres://mediahub:postgres@localhost:5432/mediahub_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        working-directory: services/api
        run: |
          CGO_ENABLED=0 go build -o /tmp/mediahub-api ./cmd/server
          CGO_ENABLED=0 GOOS=linux go build -o /tmp/mediahub-api-linux ./cmd/server

      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: services/api/coverage.out
          flags: backend

  # ---------- 前端 Admin ----------
  admin:
    name: Admin (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/admin/package-lock.json

      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: services/admin/dist

  # ---------- 前端 Web Player ----------
  web-player:
    name: Web Player (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-player

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web-player/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-player-dist
          path: services/web-player/dist

  # ---------- Docker 构建 ----------
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [backend, admin, web-player]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: ghcr.io/mediahub/mediahub-api:latest,ghcr.io/mediahub/mediahub-api:${{ github.sha }}

      - name: Build & push Admin
        uses: docker/build-push-action@v5
        with:
          context: services/admin
          push: true
          tags: ghcr.io/mediahub/mediahub-admin:latest,ghcr.io/mediahub/mediahub-admin:${{ github.sha }}

      - name: Build & push Web Player
        uses: docker/build-push-action@v5
        with:
          context: services/web-player
          push: true
          tags: ghcr.io/mediahub/mediahub-web-player:latest,ghcr.io/mediahub/mediahub-web-player:${{ github.sha }}

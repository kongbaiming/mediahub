# MediaHub 直播推流配置（MediaMTX）
# 文档：https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

# MediaMTX 1.x 默认启用鉴权，内网家庭场景需显式放行推流与拉流
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
        path:

# RTMP 推流入口（OBS / FFmpeg）
rtmp: yes
rtmpAddress: :1935

# HLS 输出（播放端拉流）
# 使用 mpegts 而非 lowLatency：OBS 默认 H.264 含 B 帧，LL-HLS 会报
# "too many reordered frames" 导致 muxer 崩溃
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 2s

# Control API（Go API 轮询推流状态；官方镜像无 curl，勿用 runOnReady webhook）
api: yes
apiAddress: :9997

# 所有路径默认为推流发布者模式
pathDefaults:
  source: publisher

paths:
  all_others:
    source: publisher

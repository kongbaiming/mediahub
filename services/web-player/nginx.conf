server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代 — 前端 axios baseURL 为空时会发到当前 origin，
    # 必须由本 nginx 转发到 api 容器，避免浏览器跨域 + CORS。
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # HLS / DASH 流代理（弱网场景，走后端转码）
    location /stream/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control no-cache;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml video/mp2t;
    gzip_min_length 1024;
}
